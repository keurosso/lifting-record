<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>リフティング記録 v1.3</title>
  <style>
    /* 全体・サッカーフィールド背景 */
    :root {
      --pitch-dark: #1b5e20;
      --pitch-light: #2e7d32;
      --pitch-line: rgba(255, 255, 255, 0.4);
      --card-bg: rgba(255, 255, 255, 0.95);
      --accent-yellow: #fbc02d;
      --accent-yellow-hover: #f57f17;
      --text-main: #1b4332;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--pitch-dark);
      /* CSSのみで芝生ストライプとラインを表現 */
      background-image: 
        linear-gradient(0deg, var(--pitch-dark) 50%, var(--pitch-light) 50%),
        linear-gradient(90deg, transparent 49%, var(--pitch-line) 49%, var(--pitch-line) 51%, transparent 51%);
      background-size: 100% 60px, 100% 100%;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* タブナビゲーション */
    .tab-nav {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    /* メインコンテンツカード */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      border: 2px solid var(--pitch-line);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 日付表示 */
    .date-header {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 12px;
      color: var(--pitch-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 今日の集計グリッド */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: #e8f5e9;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      border: 1px solid #a5d6a7;
    }

    .stat-box.highlight {
      background: #fffde7;
      border-color: #ffe082;
      grid-column: span 2;
    }

    .stat-label {
      font-size: 12px;
      color: #555;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: bold;
      color: var(--pitch-dark);
    }

    .stat-box.highlight .stat-value {
      font-size: 28px;
      color: #d84315;
    }

    /* 入力ディスプレイ */
    .display-container {
      background: #111;
      border-radius: 10px;
      padding: 12px;
      text-align: right;
      margin-bottom: 12px;
      border: 2px solid #333;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }

    .display-value {
      font-family: 'Courier New', Courier, monospace;
      font-size: 40px;
      font-weight: bold;
      color: #00ff66;
      min-height: 48px;
      line-height: 48px;
      letter-spacing: 2px;
    }

    /* テンキー */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .key-btn {
      background: #ffffff;
      border: 2px solid #ccc;
      border-bottom: 4px solid #bbb;
      border-radius: 10px;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      padding: 14px 0;
      cursor: pointer;
      text-align: center;
      transition: active 0.1s;
      touch-action: manipulation;
    }

    .key-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
      background: #eee;
    }

    .key-btn.action {
      background: #ffe0b2;
      border-color: #ffcc80;
      border-bottom-color: #ffb74d;
      color: #e65100;
    }

    /* 記録追加ボタン（黄色） */
    .btn-submit {
      width: 100%;
      background: var(--accent-yellow);
      border: none;
      border-bottom: 4px solid #f57f17;
      border-radius: 12px;
      color: #333;
      font-size: 20px;
      font-weight: bold;
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
      background: var(--accent-yellow-hover);
    }

    /* 履歴エリア */
    .history-title {
      font-weight: bold;
      margin: 16px 0 8px 0;
      color: var(--pitch-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }

    .history-item {
      background: #f1f8e9;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      border-left: 4px solid var(--pitch-light);
    }

    .history-item-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 4px;
      color: #2e7d32;
    }

    .history-item-details {
      font-size: 12px;
      color: #555;
      word-break: break-all;
    }

    /* 削除ボタン群 */
    .action-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-danger-sub, .btn-danger {
      flex: 1;
      padding: 10px;
      border: 1px solid #ef5350;
      border-radius: 8px;
      background: #ffebee;
      color: #c62828;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn-danger {
      background: #ef5350;
      color: #fff;
    }

    /* グラフ描画エリア */
    .graph-container {
      position: relative;
      width: 100%;
      height: 220px;
      margin-top: 10px;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* ユーティリティ */
    .unit {
      font-size: 12px;
      font-weight: normal;
      margin-left: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- タブ切り替え -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('record')">⚽ 記録</button>
    <button class="tab-btn" onclick="switchTab('graph')">📈 グラフ</button>
  </div>

  <!-- 1. 記録タブ -->
  <div id="tab-record" class="tab-content active">
    <div class="card">
      <div class="date-header">
        📅 <span id="current-date-str">2026/08/29</span>
      </div>

      <!-- 今日の集計結果 -->
      <div class="stats-grid">
        <div class="stat-box highlight">
          <div class="stat-label">今日の最高記録</div>
          <div class="stat-value" id="stat-today-max">0<span class="unit">回</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">今日の合計</div>
          <div class="stat-value" id="stat-today-sum">0<span class="unit">回</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">今日の平均</div>
          <div class="stat-value" id="stat-today-avg">0<span class="unit">回</span></div>
        </div>
      </div>

      <!-- テンキー＆ディスプレイ -->
      <div class="display-container">
        <div class="display-value" id="input-display">0</div>
      </div>

      <div class="keypad">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <button class="key-btn action" onclick="pressKey('back')">←</button>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn action" onclick="pressKey('clear')">C</button>
      </div>

      <button class="btn-submit" onclick="addRecord()">
        今日の記録に追加 ⚽
      </button>

      <div class="action-group">
        <button class="btn-danger-sub" onclick="deleteLastRecord()">直前の記録を削除</button>
        <button class="btn-danger" onclick="clearAllData()">全部消去</button>
      </div>
    </div>

    <!-- 履歴一覧 -->
    <div class="card" style="margin-top: 12px;">
      <div class="history-title">
        <span>📋 日ごとの記録</span>
      </div>
      <div class="history-list" id="history-list-container">
        <!-- JSで動的生成 -->
      </div>
    </div>
  </div>

  <!-- 2. グラフタブ -->
  <div id="tab-graph" class="tab-content">
    <div class="card">
      <div class="date-header">
        📊 過去14日間の記録
      </div>

      <!-- 14日間集計 -->
      <div class="stats-grid">
        <div class="stat-box highlight">
          <div class="stat-label">14日間の最高記録</div>
          <div class="stat-value" id="stat-period-max">0<span class="unit">回</span></div>
        </div>
        <div class="stat-box" style="grid-column: span 2;">
          <div class="stat-label">14日間の平均回数</div>
          <div class="stat-value" id="stat-period-avg">0<span class="unit">回</span></div>
        </div>
      </div>

      <!-- Canvas折れ線グラフ -->
      <div class="graph-container">
        <canvas id="chartCanvas"></canvas>
      </div>

      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot" style="background: #e65100;"></div>
          <span>● 最高記録</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: #0288d1;"></div>
          <span>○ 平均回数</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // localStorageキー（仕様書14より既存互換）
  const STORAGE_KEY = "lifting-records-v2";

  // グローバルデータ構造: { "YYYY-MM-DD": [23, 51, 38], ... }
  let dbData = {};
  let currentInputValue = "";

  // 初期化
  window.addEventListener("DOMContentLoaded", () => {
    loadData();
    updateDateDisplay();
    renderTodayStats();
    renderHistoryList();
  });

  // 日付文字列取得（YYYY-MM-DD）
  function getTodayKey() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const date = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${date}`;
  }

  // 表示用日付フォーマット
  function updateDateDisplay() {
    const d = new Date();
    const month = d.getMonth() + 1;
    const date = d.getDate();
    const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
    const day = dayNames[d.getDay()];
    document.getElementById("current-date-str").textContent = `${d.getFullYear()}/${month}/${date} (${day})`;
  }

  // データ読込
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        dbData = JSON.parse(raw);
      } else {
        dbData = {};
      }
    } catch (e) {
      console.error("Data load error", e);
      dbData = {};
    }
  }

  // データ保存
  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dbData));
    } catch (e) {
      alert("データの保存に失敗しました。");
    }
  }

  // テンキー操作
  function pressKey(key) {
    if (key === 'clear') {
      currentInputValue = "";
    } else if (key === 'back') {
      currentInputValue = currentInputValue.slice(0, -1);
    } else {
      // 最大5桁制限
      if (currentInputValue.length < 5) {
        // 先頭の無駄な0を防止
        if (currentInputValue === "" && key === '0') return;
        currentInputValue += key;
      }
    }
    document.getElementById("input-display").textContent = currentInputValue || "0";
  }

  // 今日の記録に追加
  function addRecord() {
    const val = parseInt(currentInputValue, 10);
    if (isNaN(val) || val <= 0) return;

    const today = getTodayKey();
    if (!dbData[today]) {
      dbData[today] = [];
    }
    dbData[today].push(val);

    saveData();
    currentInputValue = "";
    document.getElementById("input-display").textContent = "0";

    renderTodayStats();
    renderHistoryList();
  }

  // 今日の統計更新
  function renderTodayStats() {
    const today = getTodayKey();
    const list = dbData[today] || [];

    if (list.length === 0) {
      document.getElementById("stat-today-max").innerHTML = `0<span class="unit">回</span>`;
      document.getElementById("stat-today-sum").innerHTML = `0<span class="unit">回</span>`;
      document.getElementById("stat-today-avg").innerHTML = `0<span class="unit">回</span>`;
      return;
    }

    const sum = list.reduce((a, b) => a + b, 0);
    const max = Math.max(...list);
    const avg = (sum / list.length).toFixed(1);

    document.getElementById("stat-today-max").innerHTML = `${max}<span class="unit">回</span>`;
    document.getElementById("stat-today-sum").innerHTML = `${sum}<span class="unit">回</span>`;
    document.getElementById("stat-today-avg").innerHTML = `${avg}<span class="unit">回</span>`;
  }

  // 履歴一覧の描画
  function renderHistoryList() {
    const container = document.getElementById("history-list-container");
    container.innerHTML = "";

    const todayKey = getTodayKey();
    const keys = Object.keys(dbData).sort().reverse(); // 新しい日付順

    if (keys.length === 0) {
      container.innerHTML = `<div style="text-align:center; color:#888; font-size:13px; padding:12px;">まだ記録がありません</div>`;
      return;
    }

    keys.forEach(key => {
      const list = dbData[key];
      if (!list || list.length === 0) return;

      const sum = list.reduce((a, b) => a + b, 0);
      const max = Math.max(...list);
      const avg = (sum / list.length).toFixed(1);

      // 表示日付の整形 (今日なら「今日」、それ以外は M/D)
      let dateLabel = key;
      if (key === todayKey) {
        dateLabel = "今日";
      } else {
        const parts = key.split("-");
        dateLabel = `${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
      }

      const item = document.createElement("div");
      item.className = "history-item";
      item.innerHTML = `
        <div class="history-item-header">
          <span>${dateLabel}</span>
          <span>最高: ${max}回</span>
        </div>
        <div class="history-item-details">
          合計 ${sum}回 / 平均 ${avg}回 (${list.length}回挑戦)<br>
          <span style="color:#777;">[ ${list.join(", ")} ]</span>
        </div>
      `;
      container.appendChild(item);
    });
  }

  // 直前の記録を削除
  function deleteLastRecord() {
    const today = getTodayKey();
    if (dbData[today] && dbData[today].length > 0) {
      if (confirm("今日入力した一番最後の記録を削除しますか？")) {
        dbData[today].pop();
        if (dbData[today].length === 0) {
          delete dbData[today];
        }
        saveData();
        renderTodayStats();
        renderHistoryList();
      }
    } else {
      alert("削除できる今日の記録がありません。");
    }
  }

  // 全消去
  function clearAllData() {
    if (confirm("これまでの記録を【すべて】消去しますか？\n※この操作は取り消せません。")) {
      dbData = {};
      saveData();
      renderTodayStats();
      renderHistoryList();
      if (document.getElementById("tab-graph").classList.contains("active")) {
        renderGraph();
      }
    }
  }

  // タブ切り替え
  function switchTab(tabName) {
    const tabs = document.querySelectorAll(".tab-content");
    const btns = document.querySelectorAll(".tab-btn");

    tabs.forEach(t => t.classList.remove("active"));
    btns.forEach(b => b.classList.remove("active"));

    if (tabName === 'record') {
      document.getElementById("tab-record").classList.add("active");
      btns[0].classList.add("active");
    } else {
      document.getElementById("tab-graph").classList.add("active");
      btns[1].classList.add("active");
      renderGraph();
    }
  }

  // 14日間グラフ描画 (Canvas)
  function renderGraph() {
    const canvas = document.getElementById("chartCanvas");
    const ctx = canvas.getContext("2d");

    // レティナディスプレイ対応
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;

    const width = canvas.width;
    const height = canvas.height;

    ctx.clearRect(0, 0, width, height);

    // 過去14日間の日付リスト生成
    const dates = [];
    const now = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      dates.push({
        key: `${y}-${m}-${day}`,
        label: `${d.getMonth() + 1}/${d.getDate()}`
      });
    }

    // データ抽出
    let globalMax = 0;
    let periodSumAll = 0;
    let periodCountAll = 0;

    const chartData = dates.map(d => {
      const list = dbData[d.key];
      if (list && list.length > 0) {
        const max = Math.max(...list);
        const sum = list.reduce((a, b) => a + b, 0);
        const avg = sum / list.length;

        if (max > globalMax) globalMax = max;
        periodSumAll += sum;
        periodCountAll += list.length;

        return { max, avg, hasData: true, label: d.label };
      }
      return { max: 0, avg: 0, hasData: false, label: d.label };
    });

    // 期間集計値の更新
    document.getElementById("stat-period-max").innerHTML = `${globalMax}<span class="unit">回</span>`;
    const periodAvg = periodCountAll > 0 ? (periodSumAll / periodCountAll).toFixed(1) : 0;
    document.getElementById("stat-period-avg").innerHTML = `${periodAvg}<span class="unit">回</span>`;

    // 描画マージン
    const paddingLeft = 60;
    const paddingRight = 30;
    const paddingTop = 40;
    const paddingBottom = 60;

    const graphW = width - paddingLeft - paddingRight;
    const graphH = height - paddingTop - paddingBottom;

    // Y軸最大値（最低10、少し余裕をもたせる）
    const yMax = Math.max(10, Math.ceil((globalMax * 1.15) / 10) * 10);

    // 背景の目盛り線
    ctx.strokeStyle = "#e0e0e0";
    ctx.lineWidth = 1.5;
    ctx.fillStyle = "#666";
    ctx.font = "20px sans-serif";
    ctx.textAlign = "right";

    const ySteps = 4;
    for (let i = 0; i <= ySteps; i++) {
      const val = Math.round((yMax / ySteps) * i);
      const y = height - paddingBottom - (graphH / ySteps) * i;
      
      ctx.beginPath();
      ctx.moveTo(paddingLeft, y);
      ctx.lineTo(width - paddingRight, y);
      ctx.stroke();

      ctx.fillText(val, paddingLeft - 10, y + 6);
    }

    // X軸（日付ラベル）
    const stepX = graphW / (dates.length - 1);
    ctx.textAlign = "center";
    
    // 隔日で日付テキスト描画
    dates.forEach((d, idx) => {
      const x = paddingLeft + idx * stepX;
      if (idx % 2 === 1 || idx === dates.length - 1) {
        ctx.fillText(d.label, x, height - paddingBottom + 30);
      }
    });

    // 座標計算関数
    const getX = (idx) => paddingLeft + idx * stepX;
    const getY = (val) => height - paddingBottom - (val / yMax) * graphH;

    // 1. 平均回数プロット (青ライン & 白抜き円)
    drawLineAndPoints(ctx, chartData, getX, getY, 'avg', '#0288d1', false);

    // 2. 最高記録プロット (オレンジライン & 塗りつぶし円)
    drawLineAndPoints(ctx, chartData, getX, getY, 'max', '#e65100', true);
  }

  // グラフ線と点の描画ヘルパー
  function drawLineAndPoints(ctx, data, getX, getY, key, color, isSolid) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();

    let isStarted = false;
    data.forEach((d, i) => {
      if (d.hasData) {
        const x = getX(i);
        const y = getY(d[key]);
        if (!isStarted) {
          ctx.moveTo(x, y);
          isStarted = true;
        } else {
          ctx.lineTo(x, y);
        }
      }
    });
    ctx.stroke();

    // 点の描画
    data.forEach((d, i) => {
      if (d.hasData) {
        const x = getX(i);
        const y = getY(d[key]);

        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        if (isSolid) {
          ctx.fillStyle = color;
          ctx.fill();
        } else {
          ctx.fillStyle = "#ffffff";
          ctx.fill();
          ctx.strokeStyle = color;
          ctx.lineWidth = 4;
          ctx.stroke();
        }
      }
    });
  }
</script>
</body>
